name: Generate Lab Attendance Report

on:
  workflow_dispatch: # Manual button for whenever you want to update the sheet
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-report.yml'
      - 'generate_report.py'

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install openpyxl
        run: pip install openpyxl

      - name: Generate Excel Report
        run: python generate_report.py

      - name: Commit and Push Excel Report to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Lab_Submission_Report.xlsx
          git commit -m "chore: update Lab_Submission_Report.xlsx" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
